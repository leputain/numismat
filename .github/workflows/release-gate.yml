name: Release Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - "compose*.yaml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - "compose*.yaml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-gate.yml"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Init release gate timing summary
        run: |
          echo "# Release Gate timings" > "$GITHUB_STEP_SUMMARY"
      - name: Install backend dependencies
        run: bash scripts/release-gate-timed.sh "uv sync" uv sync --frozen
      - name: Install frontend dependencies
        run: bash scripts/release-gate-timed.sh "make frontend-install" make frontend-install
      - name: Check compose configs
        run: bash scripts/release-gate-timed.sh "compose-config" make compose-config
      - name: Check OpenAPI contract
        run: bash scripts/release-gate-timed.sh "openapi-check" make openapi-check
      - name: Check frontend API sync
        run: bash scripts/release-gate-timed.sh "frontend-api-check" make frontend-api-check
      - name: Audit frontend deps
        run: bash scripts/release-gate-timed.sh "frontend-audit" make frontend-audit
