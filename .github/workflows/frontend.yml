name: Frontend

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/export_openapi.py"
      - "src/finbot/adapters/http/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/export_openapi.py"
      - "src/finbot/adapters/http/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend contract dependencies
        run: uv sync --frozen
      - name: Install exact frontend dependencies
        run: make frontend-install
      - name: Check generated contract, types, smoke, and production build
        run: make frontend-check
