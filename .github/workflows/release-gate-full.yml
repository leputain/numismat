name: Release Gate Full Timed

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Release gate profile'
        required: false
        default: release-gate-timed
        type: choice
        options:
          - release-gate-timed
          - check-timed

permissions:
  contents: read

jobs:
  release-gate-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run full timed release gate
        run: |
          echo "# Full Release Gate timings" > "$GITHUB_STEP_SUMMARY"
          bash scripts/release-gate-timed.sh "${{ github.event.inputs.profile }}" make "${{ github.event.inputs.profile }}"
