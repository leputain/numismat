pid /tmp/nginx/nginx.pid;
worker_processes auto;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $numismat_route_group {
        default "spa";
        ~^/api(?:/|$) "api";
        ~^/health(?:/|$) "health";
        ~^/assets(?:/|$) "asset";
    }
    map $status $numismat_result {
        ~^[123] "success";
        ~^4 "rejected";
        default "error";
    }
    # Only the expensive raw upload is rate-limited. Empty keys are not stored;
    # the separate GET collection route remains under the generic API policy.
    map $request_method $bank_import_upload_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $bank_import_upload_key zone=bank_import_upload:1m rate=2r/m;
    log_format privacy escape=json
        '{"component":"web_edge","event":"edge_request_completed",'
        '"route_group":"$numismat_route_group","result":"$numismat_result",'
        '"status":$status}';
    access_log /dev/stdout privacy;

    server_tokens off;
    etag off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    upstream finbot_api {
        zone finbot_api 64k;
        server api:8080 resolve;
        keepalive 8;
    }

    include /tmp/nginx/conf.d/*.conf;
}
